name: Motor APK — v14 Ultra Optimizado (API 21–27)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pruebas de regresión del contrato Ultra y compatibilidad V14
        run: python3 -m unittest discover -s tests -v
      - name: Compilar plantilla y editor para API 21
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PL=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar
          mkdir -p tobj tout eobj eout pack/assets apksig res/mipmap-xxxhdpi

          python3 - <<'PY'
          import struct, zlib
          w = h = 192
          raw = b''.join(b'\x00' + bytes([40, 120, 220, 255]) * w for _ in range(h))
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
          open('res/mipmap-xxxhdpi/ic.png', 'wb').write(png)
          PY
          "$BT/aapt2" compile --dir res -o res.zip

          # Plantilla exportada: Android 5.0+; conserva deliberadamente targetSdk 28 de V14.
          "$BT/aapt2" link -o tpl-ultra.apk -I "$PL" --manifest PlayerManifest.xml --min-sdk-version 21 --target-sdk-version 28 res.zip
          javac -encoding UTF-8 -source 8 -target 8 -classpath "$PL" -d tobj Game.java GameView.java PlayActivity.java VideoLayer.java
          "$BT/d8" --release --min-api 21 --lib "$PL" --output tout $(find tobj -name '*.class')
          zip -j tpl-ultra.apk tout/classes.dex
          cp tpl-ultra.apk pack/assets/template.apk

          # Editor Ultra separado: minSdk 21, targetSdk 33 (no se reduce por compatibilidad).
          unzip -q "$BT/lib/apksigner.jar" 'com/android/apksig/*' -d apksig
          "$BT/aapt2" link -o base-ultra.apk -I "$PL" --manifest AndroidManifest.xml --min-sdk-version 21 --target-sdk-version 33
          javac -encoding UTF-8 -source 8 -target 8 -classpath "$PL:apksig" -d eobj Game.java GameView.java PlayActivity.java VideoLayer.java EditorActivity.java ProjectsActivity.java Exporter.java Sign.java AssetOrdersImport.java
          "$BT/d8" --release --min-api 21 --lib "$PL" --output eout $(find eobj apksig -name '*.class')
          zip -j base-ultra.apk eout/classes.dex
          (cd pack && zip -r ../base-ultra.apk assets)
          "$BT/zipalign" -f 4 base-ultra.apk aligned-ultra.apk
          keytool -genkeypair -keystore ultra.jks -alias ultra -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Motor Ultra"
          "$BT/apksigner" sign --ks ultra.jks --ks-pass pass:123456 --out motor-v14-ultra.apk aligned-ultra.apk
          "$BT/apksigner" verify --verbose motor-v14-ultra.apk
          unzip -tq motor-v14-ultra.apk
          "$BT/aapt" dump badging motor-v14-ultra.apk | tee editor-badging.txt
          "$BT/aapt" dump badging tpl-ultra.apk | tee template-badging.txt
          grep -F "sdkVersion:'21'" editor-badging.txt
          grep -F "targetSdkVersion:'33'" editor-badging.txt
          grep -F "sdkVersion:'21'" template-badging.txt
          grep -F "targetSdkVersion:'28'" template-badging.txt
          zip -j motor-v14-ultra.zip motor-v14-ultra.apk herramientas/trim-assets.html DOCUMENTACION.txt RELEASE-v14.md AUDITORIA-ULTRA-v14.md
          unzip -tq motor-v14-ultra.zip
      - uses: actions/upload-artifact@v4
        with:
          name: motor-v14-ultra-api21-27
          path: motor-v14-ultra.zip
          if-no-files-found: error
          retention-days: 30
