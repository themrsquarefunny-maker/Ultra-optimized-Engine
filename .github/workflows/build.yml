name: Motor APK — última versión v13
on:
  push:
    tags: ['v13']
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar plantilla y editor
        run: |
          set -e
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          PL=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -1)/android.jar
          mkdir -p tobj tout eobj eout pack/assets apksig res/mipmap-xxxhdpi

          python3 -c "
          import zlib,struct
          w=h=192
          raw=b''.join(b'\x00'+bytes([40,120,220,255])*w for _ in range(h))
          def ch(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+ch(b'IDAT',zlib.compress(raw,9))+ch(b'IEND',b'')
          open('res/mipmap-xxxhdpi/ic.png','wb').write(png)
          "
          $BT/aapt2 compile --dir res -o res.zip

          # 1) Plantilla del juego (incluye VideoLayer)
          $BT/aapt2 link -o tpl.apk -I $PL --manifest PlayerManifest.xml --min-sdk-version 24 --target-sdk-version 28 res.zip
          javac -encoding UTF-8 -source 8 -target 8 -classpath $PL -d tobj Game.java GameView.java PlayActivity.java VideoLayer.java
          $BT/d8 --release --min-api 24 --lib $PL --output tout $(find tobj -name '*.class')
          zip -j tpl.apk tout/classes.dex
          cp tpl.apk pack/assets/template.apk

          # 2) Editor
          unzip -q $BT/lib/apksigner.jar 'com/android/apksig/*' -d apksig
          $BT/aapt2 link -o base.apk -I $PL --manifest AndroidManifest.xml --min-sdk-version 26 --target-sdk-version 33
          javac -encoding UTF-8 -source 8 -target 8 -classpath $PL:apksig -d eobj Game.java GameView.java PlayActivity.java VideoLayer.java EditorActivity.java ProjectsActivity.java Exporter.java Sign.java AssetOrdersImport.java
          $BT/d8 --release --min-api 26 --lib $PL --output eout $(find eobj apksig -name '*.class')
          zip -j base.apk eout/classes.dex
          (cd pack && zip -r ../base.apk assets)
          $BT/zipalign -f 4 base.apk aligned.apk
          keytool -genkeypair -keystore k.jks -alias a -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Motor"
          $BT/apksigner sign --ks k.jks --ks-pass pass:123456 --out motor-v13.apk aligned.apk
          $BT/apksigner verify motor-v13.apk
          zip -j motor-v13.zip motor-v13.apk herramientas/trim-assets.html DOCUMENTACION.txt
          unzip -tq motor-v13.zip
      - uses: actions/upload-artifact@v4
        with:
          name: motor-v13
          path: motor-v13.zip
      - name: Publicar release (solo con tag v13)
        if: github.ref == 'refs/tags/v13'
        uses: softprops/action-gh-release@v2
        with:
          name: Motor v13 — Última versión
          make_latest: true
          body_path: RELEASE-v13.md
          fail_on_unmatched_files: true
          files: motor-v13.zip
